<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>道路形状の確認</title>
  <style>
    body { margin: 24px; font: 16px system-ui, sans-serif; background: #eaf1f5; color: #203143; }
    button { padding: 9px 14px; margin: 4px; cursor: pointer; }
    .preview { width: min(100%, 980px); height: min(65vh, 540px); background: #c5e5fa; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
  <script src="../vendor/three.min.js" defer></script>
  <script src="../road-geometry.js" defer></script>
  <script src="../drive-3d.js" defer></script>
  <script src="road-preview.js" defer></script>
</head>
<body>
  <h1>道路形状の確認</h1>
  <p>上から道路の外周を確認し、走行視点に切り替えて各分岐を試せます。</p>
  <div>
    <button type="button" data-count="2">2択のY字路</button>
    <button type="button" data-count="3">3択交差点</button>
    <button type="button" data-count="4">4択交差点</button>
    <button type="button" id="view">上から見る</button>
    <button type="button" id="left">左に進む</button>
    <button type="button" id="right">右に進む</button>
    <button type="button" id="left-middle">左折の途中を確認</button>
    <button type="button" id="right-end">右折の出口を確認</button>
  </div>
  <div class="preview"><canvas id="preview"></canvas></div>
</body>
</html>
